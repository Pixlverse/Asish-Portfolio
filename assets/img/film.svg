<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Film set placeholder">
  <defs>
    <radialGradient id="fg" cx="62%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#2a2a2a"/>
      <stop offset="50%"  stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="beam" x1="0.7" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#fg)"/>

  <!-- light beam from a lamp off-frame -->
  <path d="M1400 0L1920 0 900 1080 420 1080z" fill="url(#beam)"/>

  <!-- crew silhouettes -->
  <g fill="#000000" fill-opacity="0.86">
    <path d="M300 1080c0-120 60-190 150-190s150 70 150 190z"/>
    <circle cx="450" cy="840" r="52"/>
    <path d="M760 1080c0-100 48-158 124-158s124 58 124 158z"/>
    <circle cx="884" cy="880" r="44"/>
  </g>

  <!-- tripod / camera suggestion -->
  <g stroke="#000000" stroke-opacity="0.8" stroke-width="10" fill="none">
    <path d="M1320 1080l90-260 90 260M1410 820v-90"/>
    <rect x="1330" y="640" width="180" height="92" fill="#000000" fill-opacity="0.85" stroke="none"/>
    <circle cx="1560" cy="686" r="30" fill="#000000" fill-opacity="0.85" stroke="none"/>
  </g>

  <rect width="1920" height="1080" filter="url(#fgrain)" opacity="0.05"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="96" y="140" font-size="26" letter-spacing="10" fill-opacity="0.28">ON SET — PLACEHOLDER</text>
    <text x="96" y="180" font-size="18" letter-spacing="4" fill-opacity="0.16">REPLACE WITH FILM STILL — 1920×1080</text>
  </g>
</svg>
