<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-label="Hiwaga Makers placeholder">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1c1c1c"/>
      <stop offset="55%"  stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="hl" cx="22%" cy="18%" r="70%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="url(#hg)"/>
  <rect width="1400" height="1000" fill="url(#hl)"/>

  <!-- abstract studio geometry -->
  <g stroke="#ffffff" stroke-opacity="0.10" fill="none">
    <rect x="120" y="140" width="520" height="720"/>
    <rect x="700" y="300" width="560" height="400"/>
    <line x1="120" y1="500" x2="1260" y2="500"/>
    <line x1="640" y1="60" x2="640" y2="940"/>
  </g>
  <circle cx="1010" cy="500" r="118" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="180" y="200" width="400" height="600" fill="#ffffff" fill-opacity="0.03"/>

  <rect width="1400" height="1000" filter="url(#hgrain)" opacity="0.05"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="120" y="905" font-size="30" letter-spacing="10" fill-opacity="0.32">HIWAGA MAKERS</text>
    <text x="120" y="945" font-size="18" letter-spacing="4" fill-opacity="0.18">IMAGE PLACEHOLDER — 1400×1000</text>
  </g>
</svg>
